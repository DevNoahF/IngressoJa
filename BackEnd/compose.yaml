services:
  frontend:
    container_name: frontend
    build:
      context: ../FrontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    container_name: backend
    build: .
    ports:
      - "5202:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    env_file:
      - .env

  database:
    image: mysql:latest
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ingressoja}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ingressoja}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - initial-data:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
  initial-data: